<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="头像占位图">
  <!-- ✏️ 待替换：用你自己的照片替换本文件，或把 index.html 里的 src 指向 assets/img/photo.jpg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe9f6"/>
      <stop offset="0.55" stop-color="#c9d9ee"/>
      <stop offset="1" stop-color="#b8c9e0"/>
    </linearGradient>
    <linearGradient id="figure" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3f6ea8"/>
      <stop offset="1" stop-color="#27446b"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="240" height="240" fill="url(#bg)"/>
    <!-- 背景装饰弧线 -->
    <circle cx="196" cy="44" r="58" fill="#ffffff" opacity="0.28"/>
    <circle cx="34" cy="206" r="46" fill="#ffffff" opacity="0.22"/>
    <!-- 肩部 -->
    <path d="M120 148c-41 0-74 26-82 62-1 4-2 8-2 12h168c0-4-1-8-2-12-8-36-41-62-82-62z" fill="url(#figure)"/>
    <!-- 头部 -->
    <circle cx="120" cy="100" r="38" fill="url(#figure)"/>
    <!-- 高光 -->
    <path d="M92 84a38 38 0 0 1 30-20" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
</svg>
